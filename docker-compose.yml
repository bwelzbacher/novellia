services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: novellia
      POSTGRES_PASSWORD: novellia
      POSTGRES_DB: novellia
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U novellia']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://novellia:novellia@db:5432/novellia?schema=public
      PORT: 3000
    ports:
      - '3000:3000'
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # Comment out for local dev with live reload — run it yourself instead:
  #  cd frontend && npm start   (requires Node 22+)
  # Uncomment to include it in `make up` / docker compose again.
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - '4200:80'
    depends_on:
      - backend

volumes:
  db-data:
  backend-uploads:
